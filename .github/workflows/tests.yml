name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
  minimal-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with Alpine and BusyBox
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:3.12-alpine
          sh -c 'apk add --no-cache build-base libffi-dev openssl-dev &&
          python -m pip install -e . pytest && python -m pytest -q'
