name: Prepare release downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: python -m pip install -e . pytest build
      - run: go test ./...
        working-directory: native-agent
      - name: Build and include the ready-to-use agents
        run: python native-agent/build.py --package
      - run: python -m pytest -q
      - name: Build installation downloads
        run: python -m build
      - name: Create the prepared source ZIP
        run: python native-agent/package_release.py
      - name: Check both installed downloads without a compiler or source checkout
        run: python tests/verify_prepared_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: reap-prepared-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
