[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reap"
version = "1.7.0"
description = "Post-exploitation loot collection and credential-reuse testing for authorized engagements"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cobrastrike62" }]
keywords = ["pentest", "ctf", "loot", "post-exploitation", "hackthebox"]
dependencies = [
    "paramiko>=3.3,<4",
    "pypsrp>=0.8,<1",
    "rich>=13.4,<14",
]

[project.urls]
Homepage = "https://github.com/Cobrastrike62/reap"
Repository = "https://github.com/Cobrastrike62/reap"

[project.optional-dependencies]
# Optional DB drivers — enable correlation login tests against discovered
# database services (mysql/postgres/mongo/mssql). Install:  pip install -e '.[db]'
db = ["pymysql>=1.1", "psycopg2-binary>=2.9", "pymongo>=4.6", "pymssql>=2.2"]
# Windows/AD extras: impacket enables SMB auth + pass-the-hash in correlation;
# cryptography lets windows_loot decrypt GPP cpassword in-band.
win = ["impacket>=0.11", "cryptography>=41"]
# Everything optional at once:  pip install -e '.[full]'
full = ["pymysql>=1.1", "psycopg2-binary>=2.9", "pymongo>=4.6", "pymssql>=2.2",
        "impacket>=0.11", "cryptography>=41"]

[project.scripts]
reap = "reap.console:main"

[tool.setuptools.packages.find]
include = ["reap*"]

[tool.setuptools.package-data]
"reap.store" = ["schema.sql"]
"reap.data" = ["*.txt"]
